
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    env_file:
      - .env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - app_storage:/var/www/html/storage/app
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: forensys
      MYSQL_USER: forensys
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  mysql_data:
  app_storage:
